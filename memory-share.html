<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>旅行记忆书架</title><link rel="stylesheet" href="assets/memory-share.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf0ef;color:#183846;font:16px/1.6 system-ui,sans-serif}header{padding:28px max(22px,calc((100% - 1100px)/2));background:#f8f6ef;border-bottom:1px solid #d0d9d7}header small{color:#985627}h1{margin:4px 0;font-family:serif;font-size:36px}header p{margin:4px 0;color:#526b75}main{max-width:1100px;margin:36px auto;padding:0 22px}button{font:inherit;cursor:pointer}#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px}.book{border:0;border-radius:5px 12px 12px 5px;background:#f3f0e8;padding:0;text-align:left;box-shadow:-7px 0 #3d7285,0 18px 32px #18384626;overflow:hidden;color:#183846;transition:transform .2s}.book:hover{transform:translateY(-5px)}.book img{display:block;width:100%;height:210px;object-fit:cover}.book strong{display:block;padding:18px 16px 8px;font:26px serif}.book span{display:block;font-size:13px;padding:0 16px 18px}.chapter{padding:24px;background:#f6f1e7;border-radius:12px;box-shadow:0 16px 40px #18384618}.chapter h2{font:32px serif}.cities{display:flex;flex-wrap:wrap;gap:10px}.cities button,.back{border:1px solid #aebfc3;background:#fffdf8;color:#183846;border-radius:8px;padding:9px 14px}.cities button[aria-pressed=true]{background:#294b58;color:#fff}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:24px}.photos button{border:0;background:#fff;padding:7px;box-shadow:0 3px 10px #18384616}.photos img{width:100%;height:180px;object-fit:cover;display:block}.notice{padding:24px;background:#f8f6ef;border-radius:12px}dialog{border:0;background:#0e1417;color:#fff;width:calc(100vw - 24px);max-width:1200px;padding:18px;border-radius:12px}dialog::backdrop{background:#060b10e8}dialog img{display:block;max-width:100%;height:72dvh;object-fit:contain;margin:auto}.viewer-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.viewer-controls button{border:1px solid #566771;background:#263c48;color:#fff;padding:10px 16px;border-radius:8px}.viewer-controls button:disabled{opacity:.35}@media(max-width:500px){#shelf{gap:24px;grid-template-columns:repeat(2,minmax(0,1fr))}.book img{height:180px}.book strong{font-size:22px}.chapter{padding:18px}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><small>旅行记忆书库 · 只读分享</small><h1>记忆书架</h1><p>一省一卷，一城一章，翻阅旅行中的照片。</p></header><main id="content"><p class="notice" role="status">正在打开记忆书架…</p></main>
<dialog id="viewer"><img id="large" alt="旅行照片"><div class="viewer-controls"><button id="prev" aria-label="上一张">‹ 上一张</button><span id="count"></span><button id="next" aria-label="下一张">下一张 ›</button><button id="close">关闭</button></div></dialog>
<script src="supabase-config.js"></script><script src="assets/memory-share.js"></script><script>
(()=>{
  const content=document.getElementById('content'),viewer=document.getElementById('viewer');let snapshot,photos=[],index=0;
  const el=(tag,text,className)=>{const node=document.createElement(tag);if(text)node.textContent=text;if(className)node.className=className;return node;};
  function showPhoto(i){index=i;document.getElementById('large').src=photos[i].dataUrl;document.getElementById('count').textContent=(i+1)+' / '+photos.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===photos.length-1;}
  document.getElementById('prev').onclick=()=>showPhoto(index-1);document.getElementById('next').onclick=()=>showPhoto(index+1);document.getElementById('close').onclick=()=>viewer.close();
  viewer.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'&&index>0)showPhoto(index-1);if(event.key==='ArrowRight'&&index<photos.length-1)showPhoto(index+1);});
  function shelf(){const grid=el('div','','');grid.id='shelf';for(const province of snapshot.provinces){const book=el('button','','book'),photo=province.cover||province.cities.flatMap(c=>c.photos)[0]?.dataUrl;if(photo){const image=el('img');image.src=photo;image.alt=province.name+'旅行书籍封面';book.append(image);}book.append(el('strong',province.name),el('span',province.cities.length+' 座城市 · '+province.cities.reduce((n,c)=>n+c.photos.length,0)+' 张照片'));book.onclick=()=>chapters(province);grid.append(book);}content.replaceChildren(grid);}
  function chapters(province){
    const section=el('section','','chapter'),back=el('button','返回书架','back');back.onclick=shelf;section.append(back,el('h2',province.name+'旅行记忆'));if(province.review)section.append(el('p',province.review));
    const tabs=el('div','','cities'),body=el('div');
    function city(chapter){tabs.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.textContent===chapter.name)));const heading=el('h3',chapter.name),info=el('p',[chapter.firstMonth,chapter.description].filter(Boolean).join(' · ')),grid=el('div','','photos');for(const [i,photo]of chapter.photos.entries()){const button=el('button'),image=el('img');image.src=photo.dataUrl;image.alt=photo.name||chapter.name+'旅行照片';image.loading='lazy';button.append(image);button.setAttribute('aria-label','查看第 '+(i+1)+' 张照片');button.onclick=()=>{photos=chapter.photos;showPhoto(i);viewer.showModal();};grid.append(button);}body.replaceChildren(heading,info,grid);if(!chapter.photos.length)body.append(el('p','这个城市暂无照片。'));}
    for(const chapter of province.cities){const button=el('button',chapter.name);button.onclick=()=>city(chapter);tabs.append(button);}section.append(tabs,body);content.replaceChildren(section);city(province.cities[0]);
  }
  const id=new URL(location.href).searchParams.get('s');
  if(!/^[a-f0-9-]{36}$/i.test(id||'')){content.replaceChildren(el('p','分享链接无效，请扫描完整的海报二维码。','notice'));return;}
  MemoryShelfShare.request({action:'read',shareId:id}).then(result=>{snapshot=result.snapshot;shelf();}).catch(error=>content.replaceChildren(el('p',error.message,'notice')));
})();
</script></body></html>
